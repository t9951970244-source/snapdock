<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<title>SnapDock — комната</title>
<style>
:root{
  --bg:#f2f2f5; --card:#fff; --ink:#1d1d1f; --ink-2:#6e6e73;
  --fill:rgba(120,120,128,.14); --accent:#0a84ff; --ok:#30d158; --bad:#ff453a;
  --ios:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --ink-2:#a1a1a6; --fill:rgba(120,120,128,.3) }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font:400 15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

/* ── вход ── */
#gate{flex:1;display:grid;place-items:center;padding:24px}
#gate .box{width:min(380px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
#gate h1{font-size:30px;font-weight:650;letter-spacing:-.02em}
#gate p{font-size:14px;color:var(--ink-2);line-height:1.5}
.field{height:50px;border-radius:14px;background:var(--fill);padding:0 16px;border:0;outline:0;width:100%;text-align:center;font-size:16px}
.go{height:50px;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;
  transition:transform .2s var(--ios),opacity .2s}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.4}

/* ── комната ── */
#room{flex:1;display:none;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);
  border-bottom:1px solid var(--fill);flex:0 0 auto}
header b{font-size:15px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:0 0 auto}
.dot.on{background:var(--ok)}
.who{font-size:12.5px;color:var(--ink-2);margin-left:auto}
.icon{width:36px;height:36px;border-radius:10px;background:var(--fill);display:grid;place-items:center;font-size:17px}

#grid{display:grid;gap:8px;padding:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  flex:0 0 auto;max-height:46vh;overflow:auto;transition:max-height .3s var(--ios)}
/* Свёрнутый вид: узкая полоса кружков, место отдаётся переписке */
#grid.small{display:flex;gap:6px;max-height:84px;overflow-x:auto;padding:6px 8px}
#grid.small .tile{width:68px;height:68px;aspect-ratio:auto;border-radius:50%;flex:0 0 auto}
#grid.small .tile span{display:none}
.tile{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--fill)}
.tile video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.tile.me video{transform:scaleX(-1)}
.tile span{position:absolute;left:8px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.5);
  padding:2px 7px;border-radius:7px;backdrop-filter:blur(8px)}
.tile.empty{display:grid;place-items:center;color:var(--ink-2);font-size:20px;font-weight:600}

#feed{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.msg{max-width:78%;padding:9px 13px;border-radius:17px;background:var(--card);font-size:14.5px;
  word-break:break-word;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff}
.msg .nm{display:block;font-size:11px;color:var(--ink-2);margin-bottom:2px}
.msg.me .nm{color:rgba(255,255,255,.75)}
.msg a{color:inherit}
.bar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .15s linear}
.sys{align-self:center;font-size:12px;color:var(--ink-2);background:none;box-shadow:none;padding:2px}

footer{display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid var(--fill);flex:0 0 auto}
#text{flex:1;height:44px;border-radius:22px;background:var(--fill);padding:0 16px;border:0;outline:0;font-size:15px}
.rnd{width:44px;height:44px;border-radius:22px;background:var(--fill);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.rnd.send{background:var(--accent);color:#fff}
#drop{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,132,255,.18);
  font-size:18px;font-weight:600;z-index:20;backdrop-filter:blur(3px)}
#drop.on{display:grid}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>SnapDock</h1>
    <p>Введите номер комнаты и пароль — их присылает тот, кто комнату создал. Работает на телефоне и на компьютере, устанавливать ничего не нужно.</p>
    <input class="field" id="gRoom" placeholder="Номер комнаты" inputmode="numeric" autocomplete="off">
    <input class="field" id="gPass" placeholder="Пароль комнаты" autocomplete="off">
    <input class="field" id="gName" placeholder="Ваше имя" autocomplete="off">
    <button class="go" id="gGo">Войти</button>
    <button id="gNew" style="background:none;color:var(--ink-2);font-size:13px;text-decoration:underline">Создать новую комнату</button>
    <p id="gErr" style="color:var(--bad)"></p>
  </div>
</div>

<div id="room">
  <header>
    <span class="dot" id="dot"></span>
    <b id="hRoom">—</b>
    <span class="who" id="hWho">—</span>
    <button class="icon" id="bSmall" title="Свернуть видео">⌄</button>
    <button class="icon" id="bPip" title="Поверх всех окон">⧉</button>
    <button class="icon" id="bCam" title="Камера">📹</button>
    <button class="icon" id="bMic" title="Микрофон">🎙</button>
    <button class="icon" id="bOut" title="Выйти">✕</button>
  </header>

  <div id="grid"></div>
  <div id="feed"></div>

  <footer>
    <button class="rnd" id="bFile" title="Отправить файл">📎</button>
    <input id="text" placeholder="Сообщение" autocomplete="off">
    <button class="rnd send" id="bSend">➤</button>
    <input type="file" id="file" multiple hidden>
  </footer>
</div>

<button id="unmute" style="display:none;position:fixed;left:50%;bottom:74px;transform:translateX(-50%);
  z-index:30;height:44px;padding:0 20px;border-radius:22px;background:var(--accent);color:#fff;
  font-size:15px;font-weight:600;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)">
  🔊 Включить звук
</button>

<div id="drop">Отпустите — отправим всем</div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const CHUNK = 16 * 1024;

let ws = null, me = '', myName = '', room = '', roomNum = '', roomPass = '';

/**
 * Метка комнаты = отпечаток от номера и пароля вместе.
 * Считается точно так же, как в виджете, иначе телефон и компьютер
 * оказались бы в разных комнатах и не увидели друг друга.
 */
async function roomKey(num, pass) {
  const data = new TextEncoder().encode(`snapdock|${String(num).trim()}|${String(pass).trim()}`);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
}
let local = null, camOn = true, micOn = true;
const pcs = new Map();      // id -> RTCPeerConnection
const tiles = new Map();    // id -> элемент плитки
const incoming = new Map(); // id файла -> сборка
let ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];

/* Ретранслятор, если он задан на сервере: /ice отдаёт список */
/* Ретранслятор, если он описан в файле ice.json рядом со страницей */
fetch('ice.json').then(r => r.json()).then(j => { if (Array.isArray(j) && j.length) ICE = j; }).catch(() => {});

/* ───────── вход ───────── */
const saved = JSON.parse(localStorage.getItem('snapdock') || '{}');
$('#gName').value = saved.name || '';
$('#gRoom').value = saved.num || '';
$('#gPass').value = saved.pass || '';

/* Приглашение можно открыть ссылкой: ...#482915-k3mpq7x */
const link = location.hash.slice(1).split('-');
if (link.length === 2) { $('#gRoom').value = link[0]; $('#gPass').value = link[1]; }

$('#gGo').onclick = enter;
$('#gNew').onclick = () => {
  const abc = 'abcdefghjkmnpqrstuvwxyz23456789';
  const r = crypto.getRandomValues(new Uint8Array(8));
  $('#gRoom').value = String(crypto.getRandomValues(new Uint32Array(1))[0] % 900000 + 100000);
  $('#gPass').value = Array.from(r, v => abc[v % abc.length]).join('').replace(/(.{4})/, '$1-');
  $('#gErr').textContent = 'Отправьте номер и пароль тем, кого зовёте';
};
for (const id of ['#gRoom', '#gPass', '#gName'])
  $(id).onkeydown = (e) => { if (e.key === 'Enter') enter(); };

async function enter() {
  roomNum = $('#gRoom').value.trim();
  roomPass = $('#gPass').value.trim();
  myName = $('#gName').value.trim() || 'Гость';
  if (!roomNum || !roomPass) { $('#gErr').textContent = 'Нужны номер комнаты и пароль'; return; }
  room = await roomKey(roomNum, roomPass);
  localStorage.setItem('snapdock', JSON.stringify({ num: roomNum, pass: roomPass, name: myName }));
  $('#gate').style.display = 'none';
  $('#room').style.display = 'flex';
  $('#hRoom').textContent = roomNum;
  startMedia().finally(connect);
}

/* ───────── камера ───────── */
async function startMedia() {
  /* Просим камеру и микрофон по отдельности: раньше отказ в одном
     убивал и второе, и человек оставался вообще без звука. */
  const tracks = [];
  try {
    const cam = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
    tracks.push(...cam.getVideoTracks());
  } catch { note('Камера недоступна — вас не видно, но остальных видно'); }
  try {
    const mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    tracks.push(...mic.getAudioTracks());
  } catch { note('Микрофон недоступен — вас не слышно'); }
  local = tracks.length ? new MediaStream(tracks) : null;
  showTile('me', myName, local, true);
}

/* Браузеры запрещают звук, пока человек не коснулся страницы. Отказ приходит
   молча — поэтому ловим его и показываем кнопку. */
let audioBlocked = false;
function playSafe(v) {
  v.play().catch(() => {
    audioBlocked = true;
    $('#unmute').style.display = 'flex';
  });
}
function unmuteAll() {
  audioBlocked = false;
  $('#unmute').style.display = 'none';
  document.querySelectorAll('#grid video').forEach((v) => { v.muted = v.dataset.me === '1'; v.play().catch(() => {}); });
}

function showTile(id, name, stream, mine) {
  let el = tiles.get(id);
  if (!el) {
    el = document.createElement('div');
    el.className = 'tile' + (mine ? ' me' : '');
    tiles.set(id, el);
    $('#grid').append(el);
  }
  el.innerHTML = '';
  if (stream) {
    const v = document.createElement('video');
    v.autoplay = true; v.playsInline = true; v.muted = !!mine;
    v.dataset.me = mine ? '1' : '0';
    v.srcObject = stream;
    v.volume = 1;
    el.append(v);
    playSafe(v);
  } else {
    el.classList.add('empty');
    el.append(document.createTextNode((name || '?').slice(0, 2).toUpperCase()));
  }
  const s = document.createElement('span');
  s.textContent = mine ? 'Вы' : name;
  el.append(s);
}

/* ───────── связь с сервером ─────────
   Обычные запросы вместо постоянного соединения: работает на любом хостинге,
   где есть PHP. Ожидание нового держится на стороне сервера до 25 секунд,
   поэтому сообщения приходят почти мгновенно, а запросов почти нет. */
const API = 'room.php';
let since = 0, polling = false, alive = false;

/* Постоянный знак этого устройства: переживает перезагрузку страницы */
const UID = (() => {
  let v = localStorage.getItem('snapdock-uid');
  if (!v) { v = [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2, '0')).join(''); localStorage.setItem('snapdock-uid', v); }
  return v;
})();

async function api(action, params = {}, body) {
  const q = new URLSearchParams({ a: action, room, ...params });
  const res = await fetch(`${API}?${q}`, body
    ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
    : {});
  return res.json();
}

function tell(obj) { if (me) api('send', { id: me }, obj).catch(() => {}); }

async function connect() {
  alive = true;
  try {
    const j = await api('join', { name: myName, uid: UID });
    if (!j.id) throw new Error('join');
    me = j.id; since = j.since || 0;
    $('#dot').classList.add('on');
    roster(j.peers);
    loop();
  } catch {
    $('#dot').classList.remove('on');
    setTimeout(connect, 2000);
  }
}

async function loop() {
  if (polling) return;
  polling = true;
  while (alive) {
    try {
      const j = await api('poll', { id: me, since });
      $('#dot').classList.add('on');
      if (typeof j.seq === 'number') since = Math.max(since, j.seq);
      if (j.peers) roster(j.peers);
      for (const m of j.msgs || []) await handle(m);
    } catch {
      $('#dot').classList.remove('on');
      await new Promise((r) => setTimeout(r, 2000));
    }
  }
  polling = false;
}

function roster(peers) {
  const list = Object.entries(peers || {}).map(([id, p]) => ({ id, name: p.name }));
  $('#hWho').textContent = list.length + ' в комнате';
  const ids = new Set(list.map((p) => p.id));
  for (const [id, el] of tiles) if (id !== 'me' && !ids.has(id)) { el.remove(); tiles.delete(id); }
  for (const p of list) {
    if (p.id === me) continue;
    if (!tiles.has(p.id)) showTile(p.id, p.name, null, false);
    // Звонит тот, чья метка больше — иначе оба звонят одновременно
    if (!pcs.has(p.id) && me > p.id) call(p.id, p.name);
  }
}

async function handle(m) {
  if (m.t === 'chat') return bubble(m.name, m.text, false);
  if (m.t === 'fmeta') {
    incoming.set(m.id, { name: m.fname, size: m.size, parts: [], got: 0,
                         el: fileBubble(m.name, m.fname, m.size, false) });
    return;
  }
  if (m.t === 'left') {
    pcs.get(m.from)?.close(); pcs.delete(m.from);
    tiles.get(m.from)?.remove(); tiles.delete(m.from);
    return;
  }
  if (m.t === 'signal' && m.to === me) return onSignal(m);
}

addEventListener('beforeunload', () => {
  alive = false;
  navigator.sendBeacon?.(`${API}?a=leave&room=${encodeURIComponent(room)}&id=${me}`);
});

function note(text) { bubble(null, text, false, true); }

function bubble(name, text, mine, sys) {
  const d = document.createElement('div');
  d.className = 'msg' + (mine ? ' me' : '') + (sys ? ' sys' : '');
  if (name && !mine && !sys) { const n = document.createElement('span'); n.className = 'nm'; n.textContent = name; d.append(n); }
  d.append(document.createTextNode(text));
  $('#feed').append(d);
  $('#feed').scrollTop = 1e9;
  return d;
}

function fileBubble(name, fname, size, mine) {
  const d = bubble(name, `${fname} · ${(size / 1048576).toFixed(1)} МБ`, mine);
  const bar = document.createElement('div'); bar.className = 'bar';
  const i = document.createElement('i'); bar.append(i); d.append(bar);
  d._fill = i;
  return d;
}

/* ───────── файлы ───────── */
/* Пакет: 8 байт метки файла + номер куска + данные. Сервер раздаёт как есть. */
function packet(idBytes, seq, data) {
  const out = new Uint8Array(12 + data.byteLength);
  out.set(idBytes, 0);
  new DataView(out.buffer).setUint32(8, seq);
  out.set(new Uint8Array(data), 12);
  return out.buffer;
}

async function sendFile(f) {
  // Файл идёт напрямую собеседнику по уже установленной видеосвязи.
  // Через хостинг его гнать нельзя: там ограничения на размер и время.
  const ch = [...pcs.values()].map((pc) => pc._dc).filter((d) => d && d.readyState === 'open');
  if (!ch.length) { note('Файлы пойдут, когда установится видеосвязь'); return; }

  const idBytes = crypto.getRandomValues(new Uint8Array(8));
  const id = [...idBytes].map((b) => b.toString(16).padStart(2, '0')).join('');
  tell({ t: 'fmeta', id, fname: f.name, size: f.size });
  const el = fileBubble(null, f.name, f.size, true);

  const buf = await f.arrayBuffer();
  for (let off = 0, n = 0; off < buf.byteLength; off += CHUNK, n++) {
    for (const d of ch) {
      while (d.bufferedAmount > 1 << 20) await new Promise((r) => setTimeout(r, 40));
      d.send(packet(idBytes, n, buf.slice(off, off + CHUNK)));
    }
    el._fill.style.width = Math.min(100, ((off + CHUNK) / buf.byteLength) * 100) + '%';
  }
}

function onBinary(buf) {
  const u = new Uint8Array(buf);
  const id = [...u.slice(0, 8)].map((b) => b.toString(16).padStart(2, '0')).join('');
  const f = incoming.get(id);
  if (!f) return;
  f.parts.push(buf.slice(12));
  f.got += buf.byteLength - 12;
  f.el._fill.style.width = Math.min(100, (f.got / f.size) * 100) + '%';
  if (f.got >= f.size) {
    const url = URL.createObjectURL(new Blob(f.parts));
    const a = document.createElement('a');
    a.href = url; a.download = f.name; a.textContent = ' Сохранить';
    f.el.append(a);
    incoming.delete(id);
  }
}

/* ───────── видео ───────── */
function peer(id, name) {
  let pc = pcs.get(id);
  if (pc) return pc;
  pc = new RTCPeerConnection({ iceServers: ICE, iceCandidatePoolSize: 4 });
  pcs.set(id, pc);
  if (local) local.getTracks().forEach((tr) => pc.addTrack(tr, local));
  else { try { pc.addTransceiver('video', { direction: 'recvonly' }); pc.addTransceiver('audio', { direction: 'recvonly' }); } catch {} }
  pc.onicecandidate = (e) => { if (e.candidate) tell({ t: 'signal', to: id, ice: e.candidate }); };
  pc.ontrack = (e) => showTile(id, name, e.streams[0], false);
  // Отдельный канал для файлов: пойдут напрямую, минуя хостинг
  const dc = pc.createDataChannel('files', { ordered: true });
  dc.binaryType = 'arraybuffer';
  pc._dc = dc;
  pc.ondatachannel = (e) => { e.channel.binaryType = 'arraybuffer'; e.channel.onmessage = (ev) => onBinary(ev.data); };
  dc.onmessage = (ev) => onBinary(ev.data);
  pc.onconnectionstatechange = () => {
    // Путь потерян — просим движок найти новый, сервер на месте и поможет
    if (pc.connectionState === 'failed') { try { pc.restartIce(); } catch {} }
  };
  return pc;
}

async function call(id, name) {
  const pc = peer(id, name);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  tell({ t: 'signal', to: id, sdp: pc.localDescription });
}

async function onSignal(m) {
  const pc = peer(m.from, m.name || '');
  if (m.sdp) {
    await pc.setRemoteDescription(m.sdp);
    if (m.sdp.type === 'offer') {
      await pc.setLocalDescription(await pc.createAnswer());
      tell({ t: 'signal', to: m.from, sdp: pc.localDescription });
    }
  } else if (m.ice) {
    try { await pc.addIceCandidate(m.ice); } catch {}
  }
}

/* ───────── кнопки ───────── */
$('#bSend').onclick = () => {
  const v = $('#text').value.trim();
  if (!v) return;
  tell({ t: 'chat', text: v });
  bubble(null, v, true);
  $('#text').value = '';
};
$('#text').onkeydown = (e) => { if (e.key === 'Enter') $('#bSend').click(); };
$('#bFile').onclick = () => $('#file').click();
$('#file').onchange = (e) => { [...e.target.files].forEach(sendFile); e.target.value = ''; };
$('#bCam').onclick = () => {
  camOn = !camOn;
  local?.getVideoTracks().forEach((t) => (t.enabled = camOn));
  $('#bCam').style.opacity = camOn ? 1 : .4;
};
$('#bMic').onclick = () => {
  micOn = !micOn;
  local?.getAudioTracks().forEach((t) => (t.enabled = micOn));
  $('#bMic').style.opacity = micOn ? 1 : .4;
};
$('#bOut').onclick = () => { alive = false; location.reload(); };
$('#unmute').onclick = unmuteAll;

/* Свернуть видео в полоску — переписке становится просторнее */
$('#bSmall').onclick = () => {
  const g = $('#grid');
  g.classList.toggle('small');
  $('#bSmall').textContent = g.classList.contains('small') ? '⌃' : '⌄';
};

/* Вынести собеседника поверх всех окон: видно, даже если свернуть браузер */
$('#bPip').onclick = async () => {
  const v = [...document.querySelectorAll('#grid video')].find((x) => x.dataset.me !== '1');
  if (!v) { note('Пока некого показывать'); return; }
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else await v.requestPictureInPicture();
  } catch { note('Этот браузер так не умеет'); }
};

/* перетаскивание файлов */
addEventListener('dragover', (e) => { e.preventDefault(); $('#drop').classList.add('on'); });
addEventListener('dragleave', () => $('#drop').classList.remove('on'));
addEventListener('drop', (e) => {
  e.preventDefault(); $('#drop').classList.remove('on');
  [...e.dataTransfer.files].forEach(sendFile);
});
</script>
</body>
</html>
